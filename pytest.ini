[pytest]
testpaths = scripts/data_modules/tests scripts/tests
pythonpath = scripts
asyncio_mode = auto
timeout = 30
timeout_method = thread
markers =
    runtime: host-neutral Python runtime contract (primary)
    codex_contract: Codex adapter, hook, and harness contract (primary)
    upstream_contract: frozen Claude/upstream layout contract, collected only in M1 (primary)
    integration: exercises multiple modules, a local subprocess, dashboard ASGI, or local Git
    windows: Windows-specific behavior
    failure: negative-path or fault-injection behavior
    model_eval: requires an explicitly authorized real model evaluation
    slow: intentionally slower deterministic test
addopts = -p scripts.pytest_bootstrap -p no:debugging -p no:asyncio -p no:timeout -p pytest_cov -p pytest_asyncio.plugin -p pytest_timeout -q --strict-markers --cov --cov-report=term-missing --cov-fail-under=90 -p no:cacheprovider -m "(runtime or codex_contract) and not model_eval"
